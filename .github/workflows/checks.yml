name: Checks

on:
  push:
  pull_request:

# The workflow only reads the repo.
permissions:
  contents: read

# A new push to the same branch cancels the run that is now out of date.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # The same lint, type check and tests as locally, so the two can't drift apart.
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
